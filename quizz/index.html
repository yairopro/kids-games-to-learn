<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>חידון ספר יהושע</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<!-- Top Bar -->
	<div class="top-bar">
		<div class="title-badge">חידון ספר יהושע</div>
		<div class="top-bar-right">
			<button class="gear-btn" id="gear-btn" aria-label="הגדרות ומוניטור" title="הגדרות ומוניטור">
				<svg viewBox="0 0 24 24">
					<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
				</svg>
			</button>
			<span class="score-badge" id="score-display">0</span>
		</div>
	</div>

	<!-- Main Quiz Card -->
	<div class="quiz-container" id="quiz-card">
		<div class="type-pill" id="item-type-pill">שאלה</div>
		<div class="prompt-area">
			<div class="prompt-text" id="prompt-text">טוען...</div>
		</div>
		<div class="choices-list" id="choices-list">
			<!-- Choice buttons will be populated by JS -->
		</div>
		<div class="next-area">
			<button class="next-btn" id="next-btn">הבא ➔</button>
		</div>
	</div>

	<!-- Victory Card -->
	<div class="quiz-container victory-card" id="victory-card">
		<div class="victory-title">🎉 כל הכבוד! 🎉</div>
		<div class="victory-desc">סיימת את כל השאלות והמילים בספר יהושע בהצלחה מוחצת!</div>
		<button class="restart-btn" id="restart-game-btn">התחל מחדש</button>
	</div>

	<!-- Monitoring Modal -->
	<div class="modal-overlay" id="monitoring-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
		<div class="modal-card">
			<div class="modal-header">
				<h3 id="modal-title">מוניטור שאלות ומשקלים</h3>
				<button class="modal-close-btn" id="modal-close-btn" aria-label="סגור">&times;</button>
			</div>
			<div class="modal-body">
				<table class="stats-table">
					<thead>
						<tr>
							<th>שאלה / מילה</th>
							<th style="text-align: center;">משקל נוכחי</th>
							<th style="text-align: center;">הצלחות</th>
							<th style="text-align: center;">טעויות</th>
						</tr>
					</thead>
					<tbody id="stats-tbody">
						<!-- Injected by JS -->
					</tbody>
				</table>
				<div class="stats-actions">
					<button id="reset-all-btn" class="btn-reset">אפס את כל הנתונים והניקוד</button>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="app.js"></script>
</body>

</html>
