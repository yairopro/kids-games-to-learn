<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>English-Hebrew Word Game</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<!-- Top Bar: Credits (left) + Score (right) -->
	<div class="top-bar">
		<div class="credits-wrap">
			<div class="credits-progress" id="credits-progress"></div>
			<div class="credits-inner">
				<span class="credits-count" id="credits-count">0</span>
			</div>
		</div>
		<div class="top-bar-right">
			<span class="save-badge" id="active-save-badge" title="Active Save Profile">Default</span>
			<button class="gear-btn" id="gear-btn" aria-label="Settings and Monitoring" title="Settings and Monitoring">
				<svg viewBox="0 0 24 24">
					<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
				</svg>
			</button>
			<span class="score">0</span>
		</div>
	</div>

	<!-- Monitoring Modal -->
	<div class="modal-overlay" id="monitoring-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
		<div class="modal-card">
			<div class="modal-header">
				<h3 id="modal-title">Settings & Saves</h3>
				<button class="modal-close-btn" id="modal-close-btn" aria-label="Close">&times;</button>
			</div>
			<div class="modal-tabs">
				<button class="modal-tab-btn active" id="tab-btn-saves" data-tab="tab-saves">Save Profiles</button>
				<button class="modal-tab-btn" id="tab-btn-stats" data-tab="tab-stats">Word Monitoring</button>
			</div>
			<div class="modal-body">
				<div class="tab-content active" id="tab-saves">
					<div class="save-create-box">
						<input type="text" id="new-save-name-input" placeholder="New save name..." maxlength="25" />
						<button id="create-save-btn">New Save</button>
					</div>
					<div class="saves-list" id="saves-list">
						<!-- Save profile cards inserted by JS -->
					</div>
				</div>
				<div class="tab-content" id="tab-stats">
					<table class="stats-table">
						<thead>
							<tr>
								<th>Word</th>
								<th style="text-align: center;">Weight</th>
								<th style="text-align: center;">Successes</th>
								<th style="text-align: center;">Fails</th>
							</tr>
						</thead>
						<tbody id="stats-tbody">
							<!-- Rows inserted by JS -->
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</div>

	<!-- Main Area: English Word -->
	<div class="main-area">
		<h2 id="english-word">Loading...</h2>
		<p id="transliteration" class="transliteration"></p>
	</div>

	<!-- Choice Area: 2x3 Grid of Hebrew Buttons -->
	<div class="choice-area" id="choice-area">
		<!-- Buttons populated by JS -->
	</div>

	<script type="module" src="js/app.js"></script>
</body>

</html>
