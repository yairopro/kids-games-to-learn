<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>English-Hebrew Word Game</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			min-height: 100vh;
			user-select: none;
			-webkit-user-select: none;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
			padding: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		/* Top Bar - Credits (left) + Score (right) */
		.top-bar {
			width: 100%;
			max-width: 600px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 15px 0;
		}

		.credits-wrap {
			position: relative;
			width: 56px;
			height: 56px;
			cursor: pointer;
		}

		.credits-progress {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: conic-gradient(#4ade80 0deg,
					#4ade80 calc(var(--progress, 0) * 360deg),
					rgba(255, 255, 255, 0.3) calc(var(--progress, 0) * 360deg));
			transition: background 0.3s ease;
		}

		.credits-inner {
			position: absolute;
			inset: 4px;
			border-radius: 50%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
		}

		.credits-count {
			font-size: 1.4rem;
			font-weight: bold;
			color: #fff;
		}

		.score {
			font-size: 2rem;
			font-weight: bold;
			color: #fff;
			background: rgba(255, 255, 255, 0.2);
			padding: 10px 25px;
			border-radius: 50px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
		}

		.top-bar-right {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.gear-btn {
			width: 48px;
			height: 48px;
			border-radius: 50%;
			border: none;
			background: rgba(255, 255, 255, 0.2);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			transition: transform 0.2s, background 0.2s;
		}

		.gear-btn:hover {
			transform: rotate(30deg) scale(1.05);
			background: rgba(255, 255, 255, 0.35);
		}

		.gear-btn:active {
			transform: scale(0.95);
		}

		.gear-btn svg {
			width: 24px;
			height: 24px;
			fill: currentColor;
		}

		/* Modal */
		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.55);
			backdrop-filter: blur(4px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1000;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.25s ease;
			padding: 20px;
		}

		.modal-overlay.open {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-card {
			background: #fff;
			width: 100%;
			max-width: 540px;
			max-height: 85vh;
			border-radius: 24px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		@keyframes popIn {
			from {
				transform: scale(0.92);
			}
			to {
				transform: scale(1);
			}
		}

		.modal-header {
			padding: 20px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid #eee;
		}

		.modal-header h3 {
			font-size: 1.4rem;
			color: #333;
		}

		.modal-close-btn {
			border: none;
			background: transparent;
			font-size: 1.8rem;
			line-height: 1;
			cursor: pointer;
			color: #888;
			padding: 4px 8px;
			border-radius: 8px;
		}

		.modal-close-btn:hover {
			color: #111;
			background: #f1f1f1;
		}

		.modal-body {
			padding: 16px 24px;
			overflow-y: auto;
			flex: 1;
		}

		.save-badge {
			font-size: 0.95rem;
			font-weight: 600;
			color: #fff;
			background: rgba(255, 255, 255, 0.25);
			padding: 8px 14px;
			border-radius: 999px;
			max-width: 140px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
		}

		.modal-tabs {
			display: flex;
			border-bottom: 1px solid #eee;
			background: #fafafa;
		}

		.modal-tab-btn {
			flex: 1;
			padding: 12px 16px;
			font-size: 1rem;
			font-weight: 600;
			color: #666;
			border: none;
			background: transparent;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			transition: color 0.2s, border-color 0.2s;
		}

		.modal-tab-btn.active {
			color: #667eea;
			border-bottom-color: #667eea;
			background: #fff;
		}

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* Saves Manager Styles */
		.save-create-box {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
		}

		.save-create-box input {
			flex: 1;
			padding: 9px 12px;
			border: 1px solid #d1d5db;
			border-radius: 10px;
			font-size: 0.95rem;
			outline: none;
		}

		.save-create-box input:focus {
			border-color: #667eea;
			box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
		}

		.save-create-box button {
			padding: 9px 16px;
			background: #667eea;
			color: #fff;
			border: none;
			border-radius: 10px;
			font-weight: 600;
			cursor: pointer;
			white-space: nowrap;
		}

		.save-create-box button:hover {
			background: #5a67d8;
		}

		.saves-list {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.save-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 12px 14px;
			border-radius: 12px;
			border: 1px solid #e5e7eb;
			background: #f9fafb;
			transition: all 0.15s;
		}

		.save-item.active {
			border-color: #667eea;
			background: #eef2ff;
		}

		.save-info {
			display: flex;
			flex-direction: column;
			gap: 4px;
			min-width: 0;
			flex: 1;
		}

		.save-title-row {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.save-name {
			font-weight: 700;
			color: #1f2937;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.active-tag {
			font-size: 0.72rem;
			font-weight: 700;
			text-transform: uppercase;
			color: #4338ca;
			background: #c7d2fe;
			padding: 2px 7px;
			border-radius: 999px;
		}

		.save-meta {
			font-size: 0.8rem;
			color: #6b7280;
		}

		.save-actions {
			display: flex;
			align-items: center;
			gap: 6px;
			margin-left: 10px;
		}

		.btn-save-action {
			padding: 6px 10px;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
			border: 1px solid transparent;
			cursor: pointer;
		}

		.btn-load {
			background: #667eea;
			color: #fff;
		}

		.btn-load:hover {
			background: #5a67d8;
		}

		.btn-rename {
			background: #e5e7eb;
			color: #374151;
		}

		.btn-rename:hover {
			background: #d1d5db;
		}

		.btn-delete {
			background: #fee2e2;
			color: #dc2626;
		}

		.btn-delete:hover:not(:disabled) {
			background: #fecaca;
		}

		.btn-delete:disabled {
			opacity: 0.4;
			cursor: not-allowed;
		}

		.stats-table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
			font-size: 0.95rem;
		}

		.stats-table th,
		.stats-table td {
			padding: 10px 12px;
			border-bottom: 1px solid #f0f0f0;
		}

		.stats-table th {
			background: #fafafa;
			color: #666;
			font-weight: 600;
			position: sticky;
			top: 0;
			z-index: 1;
		}

		.stats-table td.num {
			text-align: center;
			font-weight: 600;
		}

		.stats-table td.num-success {
			color: #16a34a;
		}

		.stats-table td.num-fail {
			color: #dc2626;
		}



		/* Main Area - English Word */
		.main-area {
			width: 100%;
			max-width: 600px;
			background: rgba(255, 255, 255, 0.95);
			border-radius: 24px;
			padding: 50px 30px;
			margin: 20px 0;
			text-align: center;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
		}

		.main-area h2 {
			font-size: 3.5rem;
			color: #333;
			font-weight: 700;
			letter-spacing: 0.1em;
		}

		.transliteration {
			font-size: 1.5rem;
			color: #666;
			margin-top: 12px;
			direction: rtl;
		}

		/* Choice Area - 2x3 Grid */
		.choice-area {
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: repeat(3, 1fr);
			gap: 15px;
			width: 100%;
			max-width: 600px;
			margin: 20px 0;
		}

		.choice-btn {
			font-size: 1.8rem;
			padding: 25px 15px;
			border: none;
			border-radius: 16px;
			background: #fff;
			color: #333;
			cursor: pointer;
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
			transition: transform 0.2s, box-shadow 0.2s;
			font-weight: 600;
		}

		.choice-btn:hover {
			transform: scale(1.03);
			box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
		}

		.choice-btn:active {
			transform: scale(0.98);
		}

		.choice-btn.correct {
			animation: greenFlash 0.6s ease;
		}

		.choice-btn.correct-show {
			background: #4ade80 !important;
			box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
		}

		.choice-btn.incorrect {
			animation: redShake 0.6s ease;
		}

		.choice-btn.hidden {
			visibility: hidden;
			pointer-events: none;
		}

		.choice-area.hidden {
			display: none;
		}

		@keyframes greenFlash {

			0%,
			100% {
				background: #fff;
			}

			50% {
				background: #4ade80;
				box-shadow: 0 0 30px #4ade80;
			}
		}

		@keyframes redShake {

			0%,
			100% {
				transform: translateX(0);
			}

			20% {
				transform: translateX(-10px);
			}

			40% {
				transform: translateX(10px);
			}

			60% {
				transform: translateX(-8px);
			}

			80% {
				transform: translateX(8px);
			}
		}

		.main-area {
			transition: transform 0.2s, box-shadow 0.2s;
		}

		.main-area.clickable {
			cursor: pointer;
		}

		.main-area.clickable:hover {
			transform: scale(1.02);
			box-shadow: 0 12px 50px rgba(0, 0, 0, 0.25);
		}

		.main-area.clickable:active {
			transform: scale(0.98);
		}

		/* Responsive */
		@media (max-width: 500px) {
			.main-area h2 {
				font-size: 2.5rem;
				letter-spacing: 0.08em;
			}

			.transliteration {
				font-size: 1.2rem;
			}

			.choice-btn {
				font-size: 1.4rem;
				padding: 20px 10px;
			}

			.score {
				font-size: 1.5rem;
			}

			.credits-wrap {
				width: 48px;
				height: 48px;
			}

			.credits-count {
				font-size: 1.2rem;
			}
		}
	</style>
</head>

<body>
	<!-- Top Bar: Credits (left) + Score (right) -->
	<div class="top-bar">
		<div class="credits-wrap">
			<div class="credits-progress" id="credits-progress"></div>
			<div class="credits-inner">
				<span class="credits-count" id="credits-count">0</span>
			</div>
		</div>
		<div class="top-bar-right">
			<span class="save-badge" id="active-save-badge" title="Active Save Profile">Default</span>
			<button class="gear-btn" id="gear-btn" aria-label="Settings and Monitoring" title="Settings and Monitoring">
				<svg viewBox="0 0 24 24">
					<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
				</svg>
			</button>
			<span class="score">0</span>
		</div>
	</div>

	<!-- Monitoring Modal -->
	<div class="modal-overlay" id="monitoring-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
		<div class="modal-card">
			<div class="modal-header">
				<h3 id="modal-title">Settings & Saves</h3>
				<button class="modal-close-btn" id="modal-close-btn" aria-label="Close">&times;</button>
			</div>
			<div class="modal-tabs">
				<button class="modal-tab-btn active" id="tab-btn-saves" data-tab="tab-saves">Save Profiles</button>
				<button class="modal-tab-btn" id="tab-btn-stats" data-tab="tab-stats">Word Monitoring</button>
			</div>
			<div class="modal-body">
				<div class="tab-content active" id="tab-saves">
					<div class="save-create-box">
						<input type="text" id="new-save-name-input" placeholder="New save name..." maxlength="25" />
						<button id="create-save-btn">New Save</button>
					</div>
					<div class="saves-list" id="saves-list">
						<!-- Save profile cards inserted by JS -->
					</div>
				</div>
				<div class="tab-content" id="tab-stats">
					<table class="stats-table">
						<thead>
							<tr>
								<th>Word</th>
								<th style="text-align: center;">Weight</th>
								<th style="text-align: center;">Successes</th>
								<th style="text-align: center;">Fails</th>
							</tr>
						</thead>
						<tbody id="stats-tbody">
							<!-- Rows inserted by JS -->
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</div>

	<!-- Main Area: English Word -->
	<div class="main-area">
		<h2 id="english-word">Loading...</h2>
		<p id="transliteration" class="transliteration"></p>
	</div>

	<!-- Choice Area: 2x3 Grid of Hebrew Buttons -->
	<div class="choice-area" id="choice-area">
		<!-- Buttons populated by JS -->
	</div>

	<script>
		// ========== DATA & STATE ==========
		const STORAGE_KEY = 'kids_word_game_stats_v1';
		const SAVES_KEY = 'kids_word_game_saves_v1';
		const ACTIVE_SAVE_KEY = 'kids_word_game_active_save_v1';
		let wordPairs = [];
		const INITIAL_WEIGHT = 10;
		let wordStats = {}; // { [english]: { successes: 0, fails: 0 } }

		// ========== STATE ==========
		let score = 0;
		let currentWord = null;
		let correctHebrew = null;
		let awaitingNextRound = false;
		let awaitingAfterCorrect = false;
		let suggestionsRevealed = false;
		let transliterationRevealed = false;

		let roundsCompleted = 0;
		let creditsSpent = 0;

		let activeSaveId = null;
		let savesMap = {}; // { [id]: { id, name, score, roundsCompleted, creditsSpent, wordStats, updatedAt } }

		// ========== DOM ELEMENTS ==========
		const scoreEl = document.querySelector('.score');
		const activeSaveBadgeEl = document.getElementById('active-save-badge');
		const creditsCountEl = document.getElementById('credits-count');
		const creditsProgressEl = document.getElementById('credits-progress');
		const englishWordEl = document.getElementById('english-word');
		const transliterationEl = document.getElementById('transliteration');
		const mainAreaEl = document.querySelector('.main-area');
		const choiceAreaEl = document.getElementById('choice-area');
		const gearBtn = document.getElementById('gear-btn');
		const monitoringModal = document.getElementById('monitoring-modal');
		const modalCloseBtn = document.getElementById('modal-close-btn');
		const tabBtnSaves = document.getElementById('tab-btn-saves');
		const tabBtnStats = document.getElementById('tab-btn-stats');
		const tabContentSaves = document.getElementById('tab-saves');
		const tabContentStats = document.getElementById('tab-stats');
		const savesListEl = document.getElementById('saves-list');
		const newSaveNameInput = document.getElementById('new-save-name-input');
		const createSaveBtn = document.getElementById('create-save-btn');
		const statsTbody = document.getElementById('stats-tbody');


		// ========== STORAGE & SAVES ==========
		function generateSaveId() {
			return 'save_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
		}

		function persistSavesMap() {
			try {
				localStorage.setItem(SAVES_KEY, JSON.stringify(savesMap));
				if (activeSaveId) {
					localStorage.setItem(ACTIVE_SAVE_KEY, activeSaveId);
				}
			} catch (e) {
				console.warn('Failed to persist saves map:', e);
			}
		}

		function loadSavedData() {
			try {
				const savedSaves = localStorage.getItem(SAVES_KEY);
				if (savedSaves) {
					savesMap = JSON.parse(savedSaves) || {};
				}
			} catch (e) {
				console.warn('Failed to load saves map:', e);
				savesMap = {};
			}

			// Migration of legacy single-save data if saves map is empty
			if (Object.keys(savesMap).length === 0) {
				let legacyScore = 0;
				let legacyRounds = 0;
				let legacyCredits = 0;
				let legacyStats = {};
				try {
					const legacy = localStorage.getItem(STORAGE_KEY);
					if (legacy) {
						const parsed = JSON.parse(legacy);
						if (typeof parsed.score === 'number') legacyScore = parsed.score;
						if (typeof parsed.roundsCompleted === 'number') legacyRounds = parsed.roundsCompleted;
						if (typeof parsed.creditsSpent === 'number') legacyCredits = parsed.creditsSpent;
						if (parsed.wordStats && typeof parsed.wordStats === 'object') legacyStats = parsed.wordStats;
					}
				} catch (e) {
					console.warn('Failed to parse legacy save:', e);
				}

				const defaultId = generateSaveId();
				savesMap[defaultId] = {
					id: defaultId,
					name: 'Default',
					score: legacyScore,
					roundsCompleted: legacyRounds,
					creditsSpent: legacyCredits,
					wordStats: legacyStats,
					updatedAt: Date.now()
				};
				activeSaveId = defaultId;
				persistSavesMap();
			} else {
				const savedActiveId = localStorage.getItem(ACTIVE_SAVE_KEY);
				if (savedActiveId && savesMap[savedActiveId]) {
					activeSaveId = savedActiveId;
				} else {
					activeSaveId = Object.keys(savesMap)[0];
					persistSavesMap();
				}
			}

			applyCurrentSaveData();
		}

		function applyCurrentSaveData() {
			const current = savesMap[activeSaveId];
			if (!current) return;
			score = current.score || 0;
			roundsCompleted = current.roundsCompleted || 0;
			creditsSpent = current.creditsSpent || 0;
			wordStats = current.wordStats || {};
			if (activeSaveBadgeEl) {
				activeSaveBadgeEl.textContent = current.name;
				activeSaveBadgeEl.title = 'Active Save: ' + current.name;
			}
		}

		function saveGameData() {
			if (!activeSaveId || !savesMap[activeSaveId]) return;
			savesMap[activeSaveId].score = score;
			savesMap[activeSaveId].roundsCompleted = roundsCompleted;
			savesMap[activeSaveId].creditsSpent = creditsSpent;
			savesMap[activeSaveId].wordStats = wordStats;
			savesMap[activeSaveId].updatedAt = Date.now();
			persistSavesMap();
			// Also sync legacy key for backwards compatibility
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify({
					score,
					roundsCompleted,
					creditsSpent,
					wordStats
				}));
			} catch (e) {}
		}

		function createNewSave(name) {
			const cleanName = (name || '').trim();
			if (!cleanName) return;
			const newId = generateSaveId();
			savesMap[newId] = {
				id: newId,
				name: cleanName,
				score: 0,
				roundsCompleted: 0,
				creditsSpent: 0,
				wordStats: {},
				updatedAt: Date.now()
			};
			loadSaveProfile(newId);
		}

		function loadSaveProfile(id) {
			if (!savesMap[id]) return;
			activeSaveId = id;
			persistSavesMap();
			applyCurrentSaveData();
			scoreEl.textContent = score;
			updateCreditsUI();
			renderSavesList();
			renderMonitoringTable();
			loadNewRound();
		}

		function renameSaveProfile(id, newName) {
			const cleanName = (newName || '').trim();
			if (!cleanName || !savesMap[id]) return;
			savesMap[id].name = cleanName;
			savesMap[id].updatedAt = Date.now();
			persistSavesMap();
			if (id === activeSaveId && activeSaveBadgeEl) {
				activeSaveBadgeEl.textContent = cleanName;
				activeSaveBadgeEl.title = 'Active Save: ' + cleanName;
			}
			renderSavesList();
		}

		function deleteSaveProfile(id) {
			if (id === activeSaveId) {
				alert('Cannot delete the currently active save.');
				return;
			}
			if (!savesMap[id]) return;
			if (!confirm(`Are you sure you want to delete save "${savesMap[id].name}"?`)) return;
			delete savesMap[id];
			persistSavesMap();
			renderSavesList();
		}

		function renderSavesList() {
			if (!savesListEl) return;
			savesListEl.innerHTML = '';
			const savesArr = Object.values(savesMap).sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));

			savesArr.forEach(save => {
				const isActive = save.id === activeSaveId;
				const item = document.createElement('div');
				item.className = 'save-item' + (isActive ? ' active' : '');

				const info = document.createElement('div');
				info.className = 'save-info';

				const titleRow = document.createElement('div');
				titleRow.className = 'save-title-row';

				const nameSpan = document.createElement('span');
				nameSpan.className = 'save-name';
				nameSpan.textContent = save.name;

				titleRow.appendChild(nameSpan);
				if (isActive) {
					const activeTag = document.createElement('span');
					activeTag.className = 'active-tag';
					activeTag.textContent = 'Active';
					titleRow.appendChild(activeTag);
				}

				const metaSpan = document.createElement('span');
				metaSpan.className = 'save-meta';
				const wordsLearned = Object.values(save.wordStats || {}).filter(st => (st.successes || 0) > 0).length;
				metaSpan.textContent = `Score: ${save.score || 0} • Rounds: ${save.roundsCompleted || 0} • Words practiced: ${wordsLearned}`;

				info.appendChild(titleRow);
				info.appendChild(metaSpan);

				const actions = document.createElement('div');
				actions.className = 'save-actions';

				if (!isActive) {
					const loadBtn = document.createElement('button');
					loadBtn.className = 'btn-save-action btn-load';
					loadBtn.textContent = 'Load';
					loadBtn.addEventListener('click', () => loadSaveProfile(save.id));
					actions.appendChild(loadBtn);
				}

				const renameBtn = document.createElement('button');
				renameBtn.className = 'btn-save-action btn-rename';
				renameBtn.textContent = 'Rename';
				renameBtn.addEventListener('click', () => {
					const newName = prompt('Enter new name for save:', save.name);
					if (newName && newName.trim()) {
						renameSaveProfile(save.id, newName.trim());
					}
				});
				actions.appendChild(renameBtn);

				const deleteBtn = document.createElement('button');
				deleteBtn.className = 'btn-save-action btn-delete';
				deleteBtn.textContent = 'Delete';
				deleteBtn.disabled = isActive;
				if (!isActive) {
					deleteBtn.addEventListener('click', () => deleteSaveProfile(save.id));
				}
				actions.appendChild(deleteBtn);

				item.appendChild(info);
				item.appendChild(actions);
				savesListEl.appendChild(item);
			});
		}

		// ========== CREDITS ==========
		function getCreditsEarned() {
			return Math.floor(roundsCompleted / 10);
		}

		function getCredits() {
			return Math.max(0, getCreditsEarned() - creditsSpent);
		}

		function getRefillProgress() {
			return (roundsCompleted % 10) / 10;
		}

		function updateCreditsUI() {
			creditsCountEl.textContent = getCredits();
			creditsProgressEl.style.setProperty('--progress', getRefillProgress());
		}

		// ========== HELPERS ==========
		function getWordWeight(english) {
			const st = wordStats[english];
			if (!st) return INITIAL_WEIGHT;
			const successes = st.successes || 0;
			const fails = st.fails || 0;
			return Math.max(0, INITIAL_WEIGHT + fails - successes);
		}

		function shuffleArray(arr) {
			const copy = [...arr];
			for (let i = copy.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[copy[i], copy[j]] = [copy[j], copy[i]];
			}
			return copy;
		}

		function getRandomWords(count, excludeHebrew) {
			const available = wordPairs.filter(p => p.hebrew !== excludeHebrew);
			const shuffled = shuffleArray(available);
			return shuffled.slice(0, count).map(p => p.hebrew);
		}

		function getAvailableWords() {
			return wordPairs.filter(p => getWordWeight(p.english) > 0);
		}

		function pickWordByWeight() {
			const available = getAvailableWords();
			if (available.length === 0) return null;
			const total = available.reduce((sum, p) => sum + getWordWeight(p.english), 0);
			let r = Math.random() * total;
			for (const p of available) {
				r -= getWordWeight(p.english);
				if (r <= 0) return p;
			}
			return available[available.length - 1];
		}

		// ========== GAME LOOP ==========
		function showGameOver() {
			mainAreaEl.classList.remove('clickable');
			englishWordEl.textContent = 'Game Over';
			transliterationEl.textContent = 'You mastered all the words!';
			choiceAreaEl.classList.add('hidden');
		}

		function loadNewRound() {
			stopAudio();
			if (currentWord !== null) {
				roundsCompleted++;
				updateCreditsUI();
				saveGameData();
			}
			awaitingNextRound = false;
			awaitingAfterCorrect = false;
			suggestionsRevealed = false;
			transliterationRevealed = false;
			mainAreaEl.classList.add('clickable');

			// Pick word by score (higher score = more likely)
			currentWord = pickWordByWeight();
			if (!currentWord) {
				showGameOver();
				return;
			}
			correctHebrew = currentWord.hebrew;

			// Display English word only (transliteration shown on click after suggestions)
			englishWordEl.textContent = currentWord.english;
			transliterationEl.textContent = '';

			// Generate 5 incorrect + 1 correct, shuffle
			const wrongAnswers = getRandomWords(5, correctHebrew);
			const allOptions = shuffleArray([...wrongAnswers, correctHebrew]);

			// Build buttons (hidden until user clicks word box)
			choiceAreaEl.innerHTML = '';
			allOptions.forEach(hebrew => {
				const btn = document.createElement('button');
				btn.className = 'choice-btn';
				btn.textContent = hebrew;
				btn.dataset.hebrew = hebrew;
				btn.addEventListener('click', handleChoice);
				choiceAreaEl.appendChild(btn);
			});
			choiceAreaEl.classList.add('hidden');
		}

		function handleChoice(e) {
			if (awaitingNextRound) return;
			const btn = e.target;
			const chosen = btn.dataset.hebrew;

			if (!wordStats[currentWord.english]) {
				wordStats[currentWord.english] = { successes: 0, fails: 0 };
			}

			if (chosen === correctHebrew) {
				score += 1;
				wordStats[currentWord.english].successes = (wordStats[currentWord.english].successes || 0) + 1;
				saveGameData();
				scoreEl.textContent = score;
				btn.classList.add('correct', 'correct-show');
				awaitingNextRound = true;
				awaitingAfterCorrect = true;
				playSuccessSequence(currentWord, () => {
					loadNewRound();
				});
			} else {
				const penalty = score < 0 ? 1 : Math.max(1, Math.trunc(score / 10) + 1);
				score -= penalty;
				wordStats[currentWord.english].fails = (wordStats[currentWord.english].fails || 0) + 1;
				saveGameData();
				scoreEl.textContent = score;
				btn.classList.add('incorrect');
				btn.disabled = true;
				btn.style.opacity = '0.5';
				btn.style.cursor = 'default';
				if (navigator.vibrate) {
					navigator.vibrate(200);
				}
				playWrongSequence(currentWord.english);
			}
		}

		// ========== AUDIO HELPERS ==========
		let currentAudio = null;
		let audioSequenceTimer = null;

		function stopAudio() {
			if (audioSequenceTimer) {
				clearTimeout(audioSequenceTimer);
				audioSequenceTimer = null;
			}
			if (currentAudio) {
				currentAudio.pause();
				currentAudio.currentTime = 0;
				currentAudio = null;
			}
			if ('speechSynthesis' in window) {
				window.speechSynthesis.cancel();
			}
		}

		function speakWord(text, lang = 'en-US', onEnded = null) {
			if ('speechSynthesis' in window) {
				window.speechSynthesis.cancel();
				const utterance = new SpeechSynthesisUtterance(text);
				utterance.lang = lang;
				if (onEnded) {
					utterance.onend = () => onEnded();
					utterance.onerror = () => onEnded();
				}
				window.speechSynthesis.speak(utterance);
			} else if (onEnded) {
				onEnded();
			}
		}

		function playAudioClip(url, fallbackText, fallbackLang = 'en-US', onEnded = null) {
			stopAudio();

			let done = false;
			const finish = () => {
				if (done) return;
				done = true;
				if (onEnded) onEnded();
			};

			const audio = new Audio(url);
			currentAudio = audio;

			const triggerFallback = () => {
				if (currentAudio === audio) {
					currentAudio = null;
				}
				speakWord(fallbackText, fallbackLang, finish);
			};

			audio.addEventListener('ended', () => {
				if (currentAudio === audio) {
					currentAudio = null;
				}
				finish();
			});
			audio.addEventListener('error', triggerFallback);
			audio.play().catch(triggerFallback);
		}

		function playWord(text) {
			playAudioClip(`mp3/en/${encodeURIComponent(text)}.en.mp3`, text, 'en-US');
		}

		function playSuccessSequence(wordObj, onComplete) {
			const hebrewUrl = `mp3/he/${encodeURIComponent(wordObj.english)}.he.mp3`;
			const englishUrl = `mp3/en/${encodeURIComponent(wordObj.english)}.en.mp3`;

			playAudioClip('mp3/right.effect.mp3', '', 'en-US', () => {
				audioSequenceTimer = setTimeout(() => {
					playAudioClip(hebrewUrl, wordObj.hebrew, 'he-IL', () => {
						audioSequenceTimer = setTimeout(() => {
							playAudioClip(englishUrl, wordObj.english, 'en-US', () => {
								audioSequenceTimer = setTimeout(() => {
									if (onComplete) onComplete();
								}, 300);
							});
						}, 200);
					});
				}, 150);
			});
		}

		function playWrongSequence(englishWord) {
			playAudioClip('mp3/wrong.effect.mp3', '', 'en-US', () => {
				audioSequenceTimer = setTimeout(() => playWord(englishWord));
			});
		}

		mainAreaEl.addEventListener('click', () => {
			if (awaitingNextRound) {
				if (awaitingAfterCorrect) return;
				loadNewRound();
				return;
			}

			// Always play the word on click
			if (currentWord) {
				playWord(currentWord.english);
			}

			if (!suggestionsRevealed) {
				suggestionsRevealed = true;
				choiceAreaEl.classList.remove('hidden');
			}
		});

		document.querySelector('.credits-wrap').addEventListener('click', () => {
			if (awaitingNextRound) return;

			if (!transliterationRevealed && getCredits() >= 1) {
				creditsSpent++;
				transliterationRevealed = true;
				transliterationEl.textContent = currentWord.transliteration;
				updateCreditsUI();
				saveGameData();
			}
		});

		// ========== MONITORING MODAL ==========
		function renderMonitoringTable() {
			statsTbody.innerHTML = '';
			const sorted = [...wordPairs].sort((a, b) => {
				const stA = wordStats[a.english] || { successes: 0, fails: 0 };
				const stB = wordStats[b.english] || { successes: 0, fails: 0 };
				const triesA = (stA.successes || 0) + (stA.fails || 0);
				const triesB = (stB.successes || 0) + (stB.fails || 0);
				return triesB - triesA;
			});
			sorted.forEach(p => {
				const tr = document.createElement('tr');
				const st = wordStats[p.english] || { successes: 0, fails: 0 };

				const tdWord = document.createElement('td');
				tdWord.textContent = p.english;

				const tdWeight = document.createElement('td');
				tdWeight.className = 'num';
				tdWeight.textContent = getWordWeight(p.english);

				const tdSuccess = document.createElement('td');
				tdSuccess.className = 'num num-success';
				tdSuccess.textContent = st.successes || 0;

				const tdFail = document.createElement('td');
				tdFail.className = 'num num-fail';
				tdFail.textContent = st.fails || 0;

				tr.appendChild(tdWord);
				tr.appendChild(tdWeight);
				tr.appendChild(tdSuccess);
				tr.appendChild(tdFail);
				statsTbody.appendChild(tr);
			});
		}

		// ========== TABS & MODAL ==========
		function switchModalTab(tabName) {
			if (tabName === 'tab-saves') {
				tabBtnSaves.classList.add('active');
				tabBtnStats.classList.remove('active');
				tabContentSaves.classList.add('active');
				tabContentStats.classList.remove('active');
			} else {
				tabBtnStats.classList.add('active');
				tabBtnSaves.classList.remove('active');
				tabContentStats.classList.add('active');
				tabContentSaves.classList.remove('active');
				renderMonitoringTable();
			}
		}

		tabBtnSaves.addEventListener('click', () => switchModalTab('tab-saves'));
		tabBtnStats.addEventListener('click', () => switchModalTab('tab-stats'));

		createSaveBtn.addEventListener('click', () => {
			const name = newSaveNameInput.value.trim();
			if (!name) return;
			createNewSave(name);
			newSaveNameInput.value = '';
		});

		newSaveNameInput.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				const name = newSaveNameInput.value.trim();
				if (!name) return;
				createNewSave(name);
				newSaveNameInput.value = '';
			}
		});

		function openModal() {
			renderSavesList();
			renderMonitoringTable();
			monitoringModal.classList.add('open');
		}

		function closeModal() {
			monitoringModal.classList.remove('open');
		}

		gearBtn.addEventListener('click', openModal);
		modalCloseBtn.addEventListener('click', closeModal);
		monitoringModal.addEventListener('click', (e) => {
			if (e.target === monitoringModal) {
				closeModal();
			}
		});

		window.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && monitoringModal.classList.contains('open')) {
				closeModal();
			}
		});



		// ========== INIT ==========
		async function initGame() {
			try {
				const response = await fetch('words.json');
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}: ${response.statusText}`);
				}
				const data = await response.json();
				wordPairs = data.map(item => ({
					english: item.word,
					transliteration: item.transliteration,
					hebrew: item.translation
				}));

				loadSavedData();
				scoreEl.textContent = score;
				updateCreditsUI();
				loadNewRound();
			} catch (err) {
				console.error('Failed to load words.json:', err);
				englishWordEl.textContent = 'Error';
				transliterationEl.textContent = 'Failed to load words.json. Please run via a local web server.';
				mainAreaEl.classList.remove('clickable');
				choiceAreaEl.classList.add('hidden');
			}
		}

		initGame();
	</script>
