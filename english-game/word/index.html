<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>English-Hebrew Word Game</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			min-height: 100vh;
			user-select: none;
			-webkit-user-select: none;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
			padding: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		/* Top Bar - Credits (left) + Score (right) */
		.top-bar {
			width: 100%;
			max-width: 600px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 15px 0;
		}

		.credits-wrap {
			position: relative;
			width: 56px;
			height: 56px;
			cursor: pointer;
		}

		.credits-progress {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: conic-gradient(#4ade80 0deg,
					#4ade80 calc(var(--progress, 0) * 360deg),
					rgba(255, 255, 255, 0.3) calc(var(--progress, 0) * 360deg));
			transition: background 0.3s ease;
		}

		.credits-inner {
			position: absolute;
			inset: 4px;
			border-radius: 50%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
		}

		.credits-count {
			font-size: 1.4rem;
			font-weight: bold;
			color: #fff;
		}

		.score {
			font-size: 2rem;
			font-weight: bold;
			color: #fff;
			background: rgba(255, 255, 255, 0.2);
			padding: 10px 25px;
			border-radius: 50px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
		}

		.top-bar-right {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.gear-btn {
			width: 48px;
			height: 48px;
			border-radius: 50%;
			border: none;
			background: rgba(255, 255, 255, 0.2);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			transition: transform 0.2s, background 0.2s;
		}

		.gear-btn:hover {
			transform: rotate(30deg) scale(1.05);
			background: rgba(255, 255, 255, 0.35);
		}

		.gear-btn:active {
			transform: scale(0.95);
		}

		.gear-btn svg {
			width: 24px;
			height: 24px;
			fill: currentColor;
		}

		/* Modal */
		.modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.55);
			backdrop-filter: blur(4px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1000;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.25s ease;
			padding: 20px;
		}

		.modal-overlay.open {
			opacity: 1;
			pointer-events: auto;
		}

		.modal-card {
			background: #fff;
			width: 100%;
			max-width: 540px;
			max-height: 85vh;
			border-radius: 24px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		@keyframes popIn {
			from {
				transform: scale(0.92);
			}
			to {
				transform: scale(1);
			}
		}

		.modal-header {
			padding: 20px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid #eee;
		}

		.modal-header h3 {
			font-size: 1.4rem;
			color: #333;
		}

		.modal-close-btn {
			border: none;
			background: transparent;
			font-size: 1.8rem;
			line-height: 1;
			cursor: pointer;
			color: #888;
			padding: 4px 8px;
			border-radius: 8px;
		}

		.modal-close-btn:hover {
			color: #111;
			background: #f1f1f1;
		}

		.modal-body {
			padding: 16px 24px;
			overflow-y: auto;
			flex: 1;
		}

		.stats-table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
			font-size: 0.95rem;
		}

		.stats-table th,
		.stats-table td {
			padding: 10px 12px;
			border-bottom: 1px solid #f0f0f0;
		}

		.stats-table th {
			background: #fafafa;
			color: #666;
			font-weight: 600;
			position: sticky;
			top: 0;
			z-index: 1;
		}

		.stats-table td.num {
			text-align: center;
			font-weight: 600;
		}

		.stats-table td.num-success {
			color: #16a34a;
		}

		.stats-table td.num-fail {
			color: #dc2626;
		}

		.modal-footer {
			padding: 16px 24px;
			border-top: 1px solid #eee;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: #fafafa;
		}

		.clear-btn {
			background: #fee2e2;
			color: #dc2626;
			border: 1px solid #fca5a5;
			padding: 8px 16px;
			border-radius: 8px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.15s;
		}

		.clear-btn:hover {
			background: #fecaca;
		}

		/* Main Area - English Word */
		.main-area {
			width: 100%;
			max-width: 600px;
			background: rgba(255, 255, 255, 0.95);
			border-radius: 24px;
			padding: 50px 30px;
			margin: 20px 0;
			text-align: center;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
		}

		.main-area h2 {
			font-size: 3.5rem;
			color: #333;
			font-weight: 700;
			letter-spacing: 0.1em;
		}

		.transliteration {
			font-size: 1.5rem;
			color: #666;
			margin-top: 12px;
			direction: rtl;
		}

		/* Choice Area - 2x3 Grid */
		.choice-area {
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: repeat(3, 1fr);
			gap: 15px;
			width: 100%;
			max-width: 600px;
			margin: 20px 0;
		}

		.choice-btn {
			font-size: 1.8rem;
			padding: 25px 15px;
			border: none;
			border-radius: 16px;
			background: #fff;
			color: #333;
			cursor: pointer;
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
			transition: transform 0.2s, box-shadow 0.2s;
			font-weight: 600;
		}

		.choice-btn:hover {
			transform: scale(1.03);
			box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
		}

		.choice-btn:active {
			transform: scale(0.98);
		}

		.choice-btn.correct {
			animation: greenFlash 0.6s ease;
		}

		.choice-btn.correct-show {
			background: #4ade80 !important;
			box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
		}

		.choice-btn.incorrect {
			animation: redShake 0.6s ease;
		}

		.choice-btn.hidden {
			visibility: hidden;
			pointer-events: none;
		}

		.choice-area.hidden {
			display: none;
		}

		@keyframes greenFlash {

			0%,
			100% {
				background: #fff;
			}

			50% {
				background: #4ade80;
				box-shadow: 0 0 30px #4ade80;
			}
		}

		@keyframes redShake {

			0%,
			100% {
				transform: translateX(0);
			}

			20% {
				transform: translateX(-10px);
			}

			40% {
				transform: translateX(10px);
			}

			60% {
				transform: translateX(-8px);
			}

			80% {
				transform: translateX(8px);
			}
		}

		.main-area {
			transition: transform 0.2s, box-shadow 0.2s;
		}

		.main-area.clickable {
			cursor: pointer;
		}

		.main-area.clickable:hover {
			transform: scale(1.02);
			box-shadow: 0 12px 50px rgba(0, 0, 0, 0.25);
		}

		.main-area.clickable:active {
			transform: scale(0.98);
		}

		/* Responsive */
		@media (max-width: 500px) {
			.main-area h2 {
				font-size: 2.5rem;
				letter-spacing: 0.08em;
			}

			.transliteration {
				font-size: 1.2rem;
			}

			.choice-btn {
				font-size: 1.4rem;
				padding: 20px 10px;
			}

			.score {
				font-size: 1.5rem;
			}

			.credits-wrap {
				width: 48px;
				height: 48px;
			}

			.credits-count {
				font-size: 1.2rem;
			}
		}
	</style>
</head>

<body>
	<!-- Top Bar: Credits (left) + Score (right) -->
	<div class="top-bar">
		<div class="credits-wrap">
			<div class="credits-progress" id="credits-progress"></div>
			<div class="credits-inner">
				<span class="credits-count" id="credits-count">0</span>
			</div>
		</div>
		<div class="top-bar-right">
			<button class="gear-btn" id="gear-btn" aria-label="Settings and Monitoring" title="Settings and Monitoring">
				<svg viewBox="0 0 24 24">
					<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
				</svg>
			</button>
			<span class="score">0</span>
		</div>
	</div>

	<!-- Monitoring Modal -->
	<div class="modal-overlay" id="monitoring-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
		<div class="modal-card">
			<div class="modal-header">
				<h3 id="modal-title">Word Monitoring</h3>
				<button class="modal-close-btn" id="modal-close-btn" aria-label="Close">&times;</button>
			</div>
			<div class="modal-body">
				<table class="stats-table">
					<thead>
						<tr>
							<th>Word</th>
							<th style="text-align: center;">Successes</th>
							<th style="text-align: center;">Fails</th>
						</tr>
					</thead>
					<tbody id="stats-tbody">
						<!-- Rows inserted by JS -->
					</tbody>
				</table>
			</div>
			<div class="modal-footer">
				<button class="clear-btn" id="clear-stats-btn">Clear All Stats</button>
			</div>
		</div>
	</div>

	<!-- Main Area: English Word -->
	<div class="main-area">
		<h2 id="english-word">Loading...</h2>
		<p id="transliteration" class="transliteration"></p>
	</div>

	<!-- Choice Area: 2x3 Grid of Hebrew Buttons -->
	<div class="choice-area" id="choice-area">
		<!-- Buttons populated by JS -->
	</div>

	<script>
		// ========== DATA & STATE ==========
		const STORAGE_KEY = 'kids_word_game_stats_v1';
		let wordPairs = [];
		const INITIAL_SCORE = 10;
		const wordScores = {};
		let wordStats = {}; // { [english]: { successes: 0, fails: 0 } }

		// ========== STATE ==========
		let score = 0;
		let currentWord = null;
		let correctHebrew = null;
		let awaitingNextRound = false;
		let awaitingAfterCorrect = false;
		let suggestionsRevealed = false;
		let transliterationRevealed = false;

		let roundsCompleted = 0;
		let creditsSpent = 0;

		// ========== DOM ELEMENTS ==========
		const scoreEl = document.querySelector('.score');
		const creditsCountEl = document.getElementById('credits-count');
		const creditsProgressEl = document.getElementById('credits-progress');
		const englishWordEl = document.getElementById('english-word');
		const transliterationEl = document.getElementById('transliteration');
		const mainAreaEl = document.querySelector('.main-area');
		const choiceAreaEl = document.getElementById('choice-area');
		const gearBtn = document.getElementById('gear-btn');
		const monitoringModal = document.getElementById('monitoring-modal');
		const modalCloseBtn = document.getElementById('modal-close-btn');
		const statsTbody = document.getElementById('stats-tbody');
		const clearStatsBtn = document.getElementById('clear-stats-btn');

		// ========== STORAGE ==========
		function loadSavedData() {
			try {
				const saved = localStorage.getItem(STORAGE_KEY);
				if (!saved) return;
				const parsed = JSON.parse(saved);
				if (typeof parsed.score === 'number') score = parsed.score;
				if (typeof parsed.roundsCompleted === 'number') roundsCompleted = parsed.roundsCompleted;
				if (typeof parsed.creditsSpent === 'number') creditsSpent = parsed.creditsSpent;
				if (parsed.wordScores && typeof parsed.wordScores === 'object') {
					Object.assign(wordScores, parsed.wordScores);
				}
				if (parsed.wordStats && typeof parsed.wordStats === 'object') {
					wordStats = parsed.wordStats;
				}
			} catch (e) {
				console.warn('Failed to load stats from localStorage:', e);
			}
		}

		function saveGameData() {
			try {
				const data = {
					score,
					roundsCompleted,
					creditsSpent,
					wordScores,
					wordStats
				};
				localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
			} catch (e) {
				console.warn('Failed to save to localStorage:', e);
			}
		}

		// ========== CREDITS ==========
		function getCreditsEarned() {
			return Math.floor(roundsCompleted / 10);
		}

		function getCredits() {
			return Math.max(0, getCreditsEarned() - creditsSpent);
		}

		function getRefillProgress() {
			return (roundsCompleted % 10) / 10;
		}

		function updateCreditsUI() {
			creditsCountEl.textContent = getCredits();
			creditsProgressEl.style.setProperty('--progress', getRefillProgress());
		}

		// ========== HELPERS ==========
		function shuffleArray(arr) {
			const copy = [...arr];
			for (let i = copy.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[copy[i], copy[j]] = [copy[j], copy[i]];
			}
			return copy;
		}

		function getRandomWords(count, excludeHebrew) {
			const available = wordPairs.filter(p => p.hebrew !== excludeHebrew);
			const shuffled = shuffleArray(available);
			return shuffled.slice(0, count).map(p => p.hebrew);
		}

		function getAvailableWords() {
			return wordPairs.filter(p => wordScores[p.english] > 0);
		}

		function pickWordByWeight() {
			const available = getAvailableWords();
			if (available.length === 0) return null;
			const total = available.reduce((sum, p) => sum + wordScores[p.english], 0);
			let r = Math.random() * total;
			for (const p of available) {
				r -= wordScores[p.english];
				if (r <= 0) return p;
			}
			return available[available.length - 1];
		}

		// ========== GAME LOOP ==========
		function showGameOver() {
			mainAreaEl.classList.remove('clickable');
			englishWordEl.textContent = 'Game Over';
			transliterationEl.textContent = 'You mastered all the words!';
			choiceAreaEl.classList.add('hidden');
		}

		function loadNewRound() {
			stopAudio();
			if (currentWord !== null) {
				roundsCompleted++;
				updateCreditsUI();
				saveGameData();
			}
			awaitingNextRound = false;
			awaitingAfterCorrect = false;
			suggestionsRevealed = false;
			transliterationRevealed = false;
			mainAreaEl.classList.add('clickable');

			// Pick word by score (higher score = more likely)
			currentWord = pickWordByWeight();
			if (!currentWord) {
				showGameOver();
				return;
			}
			correctHebrew = currentWord.hebrew;

			// Display English word only (transliteration shown on click after suggestions)
			englishWordEl.textContent = currentWord.english;
			transliterationEl.textContent = '';

			// Generate 5 incorrect + 1 correct, shuffle
			const wrongAnswers = getRandomWords(5, correctHebrew);
			const allOptions = shuffleArray([...wrongAnswers, correctHebrew]);

			// Build buttons (hidden until user clicks word box)
			choiceAreaEl.innerHTML = '';
			allOptions.forEach(hebrew => {
				const btn = document.createElement('button');
				btn.className = 'choice-btn';
				btn.textContent = hebrew;
				btn.dataset.hebrew = hebrew;
				btn.addEventListener('click', handleChoice);
				choiceAreaEl.appendChild(btn);
			});
			choiceAreaEl.classList.add('hidden');
		}

		function handleChoice(e) {
			if (awaitingNextRound) return;
			const btn = e.target;
			const chosen = btn.dataset.hebrew;

			if (!wordStats[currentWord.english]) {
				wordStats[currentWord.english] = { successes: 0, fails: 0 };
			}

			if (chosen === correctHebrew) {
				score += 1;
				wordScores[currentWord.english] = Math.max(0, wordScores[currentWord.english] - 1);
				wordStats[currentWord.english].successes = (wordStats[currentWord.english].successes || 0) + 1;
				saveGameData();
				scoreEl.textContent = score;
				btn.classList.add('correct', 'correct-show');
				awaitingNextRound = true;
				awaitingAfterCorrect = true;
				playSuccessSequence(currentWord, () => {
					loadNewRound();
				});
			} else {
				score -= 1;
				wordScores[currentWord.english] = (wordScores[currentWord.english] || INITIAL_SCORE) + 1;
				wordStats[currentWord.english].fails = (wordStats[currentWord.english].fails || 0) + 1;
				saveGameData();
				scoreEl.textContent = score;
				btn.classList.add('incorrect');
				btn.disabled = true;
				btn.style.opacity = '0.5';
				btn.style.cursor = 'default';
				if (navigator.vibrate) {
					navigator.vibrate(200);
				}
				playWrongSequence(currentWord.english);
			}
		}

		// ========== AUDIO HELPERS ==========
		let currentAudio = null;
		let audioSequenceTimer = null;

		function stopAudio() {
			if (audioSequenceTimer) {
				clearTimeout(audioSequenceTimer);
				audioSequenceTimer = null;
			}
			if (currentAudio) {
				currentAudio.pause();
				currentAudio.currentTime = 0;
				currentAudio = null;
			}
			if ('speechSynthesis' in window) {
				window.speechSynthesis.cancel();
			}
		}

		function speakWord(text, lang = 'en-US', onEnded = null) {
			if ('speechSynthesis' in window) {
				window.speechSynthesis.cancel();
				const utterance = new SpeechSynthesisUtterance(text);
				utterance.lang = lang;
				if (onEnded) {
					utterance.onend = () => onEnded();
					utterance.onerror = () => onEnded();
				}
				window.speechSynthesis.speak(utterance);
			} else if (onEnded) {
				onEnded();
			}
		}

		function playAudioClip(url, fallbackText, fallbackLang = 'en-US', onEnded = null) {
			stopAudio();

			let done = false;
			const finish = () => {
				if (done) return;
				done = true;
				if (onEnded) onEnded();
			};

			const audio = new Audio(url);
			currentAudio = audio;

			const triggerFallback = () => {
				if (currentAudio === audio) {
					currentAudio = null;
				}
				speakWord(fallbackText, fallbackLang, finish);
			};

			audio.addEventListener('ended', () => {
				if (currentAudio === audio) {
					currentAudio = null;
				}
				finish();
			});
			audio.addEventListener('error', triggerFallback);
			audio.play().catch(triggerFallback);
		}

		function playWord(text) {
			playAudioClip(`mp3/en/${encodeURIComponent(text)}.en.mp3`, text, 'en-US');
		}

		function playSuccessSequence(wordObj, onComplete) {
			const hebrewUrl = `mp3/he/${encodeURIComponent(wordObj.english)}.he.mp3`;
			const englishUrl = `mp3/en/${encodeURIComponent(wordObj.english)}.en.mp3`;

			playAudioClip('mp3/right.effect.mp3', '', 'en-US', () => {
				audioSequenceTimer = setTimeout(() => {
					playAudioClip(hebrewUrl, wordObj.hebrew, 'he-IL', () => {
						audioSequenceTimer = setTimeout(() => {
							playAudioClip(englishUrl, wordObj.english, 'en-US', () => {
								audioSequenceTimer = setTimeout(() => {
									if (onComplete) onComplete();
								}, 300);
							});
						}, 200);
					});
				}, 150);
			});
		}

		function playWrongSequence(englishWord) {
			playAudioClip('mp3/wrong.effect.mp3', '', 'en-US', () => {
				audioSequenceTimer = setTimeout(() => playWord(englishWord));
			});
		}

		mainAreaEl.addEventListener('click', () => {
			if (awaitingNextRound) {
				if (awaitingAfterCorrect) return;
				loadNewRound();
				return;
			}

			// Always play the word on click
			if (currentWord) {
				playWord(currentWord.english);
			}

			if (!suggestionsRevealed) {
				suggestionsRevealed = true;
				choiceAreaEl.classList.remove('hidden');
			}
		});

		document.querySelector('.credits-wrap').addEventListener('click', () => {
			if (awaitingNextRound) return;

			if (!transliterationRevealed && getCredits() >= 1) {
				creditsSpent++;
				transliterationRevealed = true;
				transliterationEl.textContent = currentWord.transliteration;
				updateCreditsUI();
				saveGameData();
			}
		});

		// ========== MONITORING MODAL ==========
		function renderMonitoringTable() {
			statsTbody.innerHTML = '';
			wordPairs.forEach(p => {
				const tr = document.createElement('tr');
				const st = wordStats[p.english] || { successes: 0, fails: 0 };

				const tdWord = document.createElement('td');
				tdWord.textContent = p.english;

				const tdSuccess = document.createElement('td');
				tdSuccess.className = 'num num-success';
				tdSuccess.textContent = st.successes || 0;

				const tdFail = document.createElement('td');
				tdFail.className = 'num num-fail';
				tdFail.textContent = st.fails || 0;

				tr.appendChild(tdWord);
				tr.appendChild(tdSuccess);
				tr.appendChild(tdFail);
				statsTbody.appendChild(tr);
			});
		}

		function openModal() {
			renderMonitoringTable();
			monitoringModal.classList.add('open');
		}

		function closeModal() {
			monitoringModal.classList.remove('open');
		}

		gearBtn.addEventListener('click', openModal);
		modalCloseBtn.addEventListener('click', closeModal);
		monitoringModal.addEventListener('click', (e) => {
			if (e.target === monitoringModal) {
				closeModal();
			}
		});

		window.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && monitoringModal.classList.contains('open')) {
				closeModal();
			}
		});

		clearStatsBtn.addEventListener('click', () => {
			if (!confirm('Are you sure you want to reset all stats, score, and credits?')) return;
			localStorage.removeItem(STORAGE_KEY);
			score = 0;
			roundsCompleted = 0;
			creditsSpent = 0;
			wordPairs.forEach(p => {
				wordScores[p.english] = INITIAL_SCORE;
			});
			wordStats = {};
			scoreEl.textContent = score;
			updateCreditsUI();
			renderMonitoringTable();
		});

		// ========== INIT ==========
		async function initGame() {
			try {
				const response = await fetch('words.json');
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}: ${response.statusText}`);
				}
				const data = await response.json();
				wordPairs = data.map(item => ({
					english: item.word,
					transliteration: item.transliteration,
					hebrew: item.translation
				}));

				wordPairs.forEach(p => {
					wordScores[p.english] = INITIAL_SCORE;
				});

				loadSavedData();
				scoreEl.textContent = score;
				updateCreditsUI();
				loadNewRound();
			} catch (err) {
				console.error('Failed to load words.json:', err);
				englishWordEl.textContent = 'Error';
				transliterationEl.textContent = 'Failed to load words.json. Please run via a local web server.';
				mainAreaEl.classList.remove('clickable');
				choiceAreaEl.classList.add('hidden');
			}
		}

		initGame();
	</script>
</body>

</html>
